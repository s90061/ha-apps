  8090/tcp: "Direct Web UI port (Home Assistant Ingress also uses internal 8090)"
map:
  - app_config:rw
  - share:rw
  - media:rw
options:
  tz: "Asia/Taipei"
  storage_dir: "/share/gridcraft"
  default_language: "auto"
  author_name: "Home Assistant"
  also_download_on_save: false
schema:
  tz: "str"
  storage_dir: "match(^/(share|config|media)(/.*)?$)"
  default_language: "list(auto|en|es|de|fr|it|pt|nl|pl|cs|ru|uk|tr|el|ro|vi|sr|zh|ja|ko)"
