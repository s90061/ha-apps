---
name: "GridCraft"
version: "0.1.0"
slug: "gridcraft"
description: "Open-source pure-Rust spreadsheet (.xlsx/.csv/.tsv/.xls/.xlsb/.ods) via WebAssembly with Home Assistant server storage."
url: "https://github.com/s90061/ha-apps/tree/main/gridcraft"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8090
