---
name: Build app

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      publish:
        required: true
        type: boolean
      force_rebuild:
        required: false
        default: false
        type: boolean

jobs:
  prepare:
    name: Prepare (${{ inputs.app }})
    if: github.repository == 's90061/ha-apps'
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ inputs.app }}"

      - name: Normalize app information
        id: normalize
        env:
          RAW_IMAGE: ${{ steps.info.outputs.image }}
          RAW_VERSION: ${{ steps.info.outputs.version }}
          RAW_NAME: ${{ steps.info.outputs.name }}
          RAW_DESCRIPTION: ${{ steps.info.outputs.description }}
          RAW_URL: ${{ steps.info.outputs.url }}
        run: |
          image=$(jq -r '. // empty' <<< "${RAW_IMAGE}")
          version=$(jq -r '. // empty' <<< "${RAW_VERSION}")
          name=$(jq -r '. // empty' <<< "${RAW_NAME}")
          description=$(jq -r '. // empty' <<< "${RAW_DESCRIPTION}")
          if [[ -n "${RAW_URL}" ]]; then
            url=$(jq -r '. // empty' <<< "${RAW_URL}")
          else
            url=""
          fi
          {
            echo "image_name=${image##*/}"
            echo "registry_prefix=${image%/*}"
            echo "version=${version}"
            echo "name=${name}"
            echo "description=${description}"
            if [[ -n "${url}" ]]; then
              echo "url=${url}"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Prepare multi-arch build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ inputs.app }} (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          cache-gha-scope: ${{ inputs.app }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./${{ inputs.app }}"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: ${{ inputs.publish }}
          skip-existing: ${{ !inputs.force_rebuild && needs.prepare.outputs.version || '' }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest (${{ inputs.app }})
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest & Cosign signature
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          cosign: "true"
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
          skip-existing: ${{ !inputs.force_rebuild && needs.prepare.outputs.version || '' }}
