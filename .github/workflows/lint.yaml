---
name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repo-checks:
    name: Line endings, permissions & consistency
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Verify Unix LF line endings and script permissions
        run: |
          set -euo pipefail
          cr=$(printf '\r')
          status=0

          while IFS= read -r -d '' file; do
            attr_binary=$(git check-attr binary -- "${file}")
            if [[ "${attr_binary}" == *": set" ]]; then
              continue
            fi

            if LC_ALL=C grep -q "${cr}" "${file}"; then
              echo "::error file=${file}::CRLF line ending detected; convert to Unix LF."
              status=1
            fi

            first_two=$(head -c 2 "${file}" 2>/dev/null || true)
            if [[ "${first_two}" == "#!" ]]; then
              mode=$(git ls-files --stage -- "${file}" | awk 'NR==1 {print $1}')
              if [[ "${mode}" != "100755" ]]; then
                echo "::error file=${file}::Executable script must have Git mode 100755 (found ${mode}). Run: git update-index --chmod=+x \"${file}\""
                status=1
              fi
            fi
          done < <(git ls-files -z)

          exit "${status}"

      - name: Validate repository.yaml and app slug consistency
        run: |
          set -euo pipefail

          repo_file=""
          for candidate in repository.yaml repository.yml repository.json; do
            if [[ -f "${candidate}" ]]; then
              repo_file="${candidate}"
              break
            fi
          done

          if [[ -z "${repo_file}" ]]; then
            echo "::error::Missing repository.yaml (or .yml/.json) at repository root."
            exit 1
          fi

          repo_name=$(yq -r '.name // ""' "${repo_file}")
          if [[ -z "${repo_name}" ]]; then
            echo "::error file=${repo_file}::Required field 'name' is missing or empty."
            exit 1
          fi

          mapfile -t configs < <(find . -mindepth 2 -maxdepth 2 \( -name 'config.yaml' -o -name 'config.yml' -o -name 'config.json' \) | sort)
          if [[ ${#configs[@]} -eq 0 ]]; then
            echo "::error::No app directories containing config.yaml found."
            exit 1
          fi

          declare -A seen_slugs=()
          status=0
          for cfg in "${configs[@]}"; do
            dir_name=$(basename "$(dirname "${cfg}")")
            slug=$(yq -r '.slug // ""' "${cfg}")
            version_type=$(yq -o=json '.' "${cfg}" | jq -r '.version | type')
            image=$(yq -r '.image // ""' "${cfg}")
            archs=$(yq -o=json '.arch // []' "${cfg}")

            if [[ "${slug}" != "${dir_name}" ]]; then
              echo "::error file=${cfg}::App slug '${slug}' must match directory name '${dir_name}'."
              status=1
            fi

            if [[ -n "${slug}" && -n "${seen_slugs[${slug}]:-}" ]]; then
              echo "::error file=${cfg}::Duplicate slug '${slug}' also found in '${seen_slugs[${slug}]}'."
              status=1
            fi
            seen_slugs["${slug}"]="${cfg}"

            if [[ "${version_type}" != "string" ]]; then
              echo "::error file=${cfg}::'version' must be a quoted string."
              status=1
            fi

            expected_image="ghcr.io/s90061/ha-apps-${slug}"
            if [[ "${image}" != "${expected_image}" ]]; then
              echo "::error file=${cfg}::Expected image '${expected_image}', found '${image}'."
              status=1
            fi

            bad_arch=$(jq -r '.[] | select(. != "aarch64" and . != "amd64")' <<< "${archs}")
            if [[ -n "${bad_arch}" ]]; then
              echo "::error file=${cfg}::Unsupported architecture(s): ${bad_arch}. Only aarch64 and amd64 are allowed."
              status=1
            fi
          done

          exit "${status}"

      - name: Run ShellCheck on repository and container scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(
            while IFS= read -r -d '' file; do
              attr_binary=$(git check-attr binary -- "${file}")
              if [[ "${attr_binary}" == *": set" ]]; then
                continue
              fi
              first_two=$(head -c 2 "${file}" 2>/dev/null || true)
              if [[ "${first_two}" == "#!" ]]; then
                printf '%s\n' "${file}"
              fi
            done < <(git ls-files -z)
          )

          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "No scripts found to check."
            exit 0
          fi

          for script in "${scripts[@]}"; do
            shebang=$(head -n 1 "${script}")
            echo "Checking ${script} (${shebang})"
            if [[ "${shebang}" == *"bash"* ]]; then
              shellcheck -s bash "${script}"
            else
              shellcheck "${script}"
            fi
          done

  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run yamllint
        uses: frenck/action-yamllint@v1.5.0
        with:
          config: ".github/yamllint.yaml"
          strict: "true"

  find:
    name: Find apps
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.addons.outputs.addons_list }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Find app directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

  app-lint:
    name: App lint (${{ matrix.path }})
    runs-on: ubuntu-latest
    needs: find
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJson(needs.find.outputs.addons) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run Home Assistant App Linter
        uses: frenck/action-app-linter@v2.21.2
        with:
          path: "./${{ matrix.path }}"
