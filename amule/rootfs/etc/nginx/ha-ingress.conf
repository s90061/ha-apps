user www-data;
worker_processes 1;
pid /run/nginx-ingress.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Strip any trailing slash from X-Ingress-Path for Set-Cookie Path rewriting.
    map $http_x_ingress_path $ha_ingress_prefix {
        "~^(/.*[^/])/?$" $1;
        default           "";
    }

    server {
        listen 8099 default_server;
        server_name _;

        # Accept traffic only from Home Assistant Supervisor Ingress and localhost probes.
        allow 172.30.32.2;
        allow 127.0.0.1;
        deny all;

        client_max_body_size 64m;

        location / {
            proxy_pass http://127.0.0.1:4711;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;

            # Rewrite amuleapi's Path=/api/v1 session cookie to /api/hassio_ingress/<token>/api/v1.
            proxy_cookie_path /api/v1 $ha_ingress_prefix/api/v1;

            # Keep SSE (/api/v1/events) and large file downloads unbuffered.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 86400s;
        }
    }
}
