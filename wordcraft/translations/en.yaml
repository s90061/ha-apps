---
configuration:
  tz:
    name: "Timezone"
    description: "Container timezone (for example: Asia/Taipei, UTC)."
  storage_dir:
    name: "Server Document Directory"
    description: "Directory on Home Assistant where WordCraft documents are saved (default: /share/wordcraft). Must be under /share, /config, or /media."
  default_language:
    name: "Default Interface Language"
    description: "Initial WordCraft interface language applied on first visit (default: zh-hant for Traditional Chinese)."
  author_name:
    name: "Default Author Name"
    description: "Author name used for comments and Track Changes in WordCraft documents."
  also_download_on_save:
    name: "Also Download to Local Computer on Save"
    description: "When enabled, saving or exporting in WordCraft both writes the file to the Home Assistant server directory and triggers a browser download to your local device."
network:
  8088/tcp: "Direct WordCraft Web UI HTTP port"
