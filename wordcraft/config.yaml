---
name: "WordCraft"
version: "0.1.0"
slug: "wordcraft"
description: "Open-source pure-Rust word processor (.docx/ODT/RTF/PDF/Markdown) via WebAssembly with Home Assistant server storage."
url: "https://github.com/s90061/ha-apps/tree/main/wordcraft"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8088
panel_icon: "mdi:file-word-box"
panel_title: "WordCraft"
ports:
  8088/tcp: 8088
ports_description:
  8088/tcp: "Direct Web UI port (Home Assistant Ingress also uses internal 8088)"
map:
  - app_config:rw
  - share:rw
  - media:rw
options:
  tz: "Asia/Taipei"
  storage_dir: "/share/wordcraft"
  default_language: "zh-hant"
  author_name: "Home Assistant"
  also_download_on_save: false
schema:
  tz: "str"
  storage_dir: "match(^/(share|config|media)(/.*)?$)"
  default_language: "list(auto|zh-hant|zh-hans|en|ja|de|fr|es)"
  author_name: "str"
  also_download_on_save: "bool"
image: "ghcr.io/s90061/ha-apps-wordcraft"
